<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Créateur de Planning</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    /* EN-TÊTE */

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    /* CONTENEUR */

    .conteneur {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* NAVIGATION */

    .navigation {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .navigation button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .navigation button:hover {
      background: #1d4ed8;
    }

    .titre-semaine {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    /* FORMULAIRE */

    .formulaire {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;

      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .formulaire h2 {
      margin-top: 0;
    }

    .champs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      margin-top: 6px;

      border: 1px solid #cbd5e1;
      border-radius: 8px;

      font-size: 15px;
    }

    .boutons-formulaire {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .bouton-principal {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .bouton-imprimer {
      background: #64748b;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* CALENDRIER */

    .calendrier {
      background: white;
      border-radius: 15px;
      overflow-x: auto;

      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .semaine {
      display: grid;
      grid-template-columns: repeat(7, minmax(160px, 1fr));

      min-width: 1120px;
    }

    .jour {
      min-height: 500px;
      border-right: 1px solid #e2e8f0;
    }

    .jour:last-child {
      border-right: none;
    }

    /* EN-TÊTE DES JOURS */

    .entete-jour {
      text-align: center;
      padding: 15px;

      background: #e2e8f0;

      border-bottom: 1px solid #cbd5e1;
    }

    .nom-jour {
      font-weight: bold;
      font-size: 15px;
    }

    .date-jour {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .mois {
      font-size: 13px;
      color: #64748b;
    }

    /* JOUR ACTUEL */

    .aujourd-hui .entete-jour {
      background: #2563eb;
      color: white;
    }

    .aujourd-hui .mois {
      color: white;
    }

    /* ACTIVITÉS */

    .activites {
      padding: 10px;
    }

    .aucune-activite {
      text-align: center;
      color: #94a3b8;
      padding: 30px 5px;
      font-size: 13px;
    }

    .activite {
      padding: 12px;
      margin-bottom: 10px;

      border-radius: 9px;

      border-left: 5px solid #2563eb;

      background: #eff6ff;
    }

    .activite-nom {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .activite-heure {
      font-size: 13px;
      color: #475569;
    }

    .actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .actions button {
      border: none;
      color: white;
      padding: 7px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .modifier {
      background: #f59e0b;
    }

    .supprimer {
      background: #dc2626;
    }

    /* PIED DE PAGE */

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      header h1 {
        font-size: 25px;
      }

      .navigation {
        flex-direction: column;
      }

      .navigation button {
        width: 100%;
      }

      .titre-semaine {
        order: -1;
      }

      .champs {
        grid-template-columns: 1fr;
      }

      .boutons-formulaire {
        flex-direction: column;
      }

      .bouton-principal,
      .bouton-imprimer {
        width: 100%;
      }

    }

    /* IMPRESSION */

    @media print {

      body {
        background: white;
      }

      header {
        background: white;
        color: black;
      }

      .navigation,
      .formulaire,
      footer,
      .actions {
        display: none;
      }

      .calendrier {
        box-shadow: none;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>📅 Mon Créateur de Planning</h1>

  <p>
    Organisez facilement votre semaine
  </p>

</header>


<div class="conteneur">


  <!-- NAVIGATION DU CALENDRIER -->

  <div class="navigation">

    <button onclick="semainePrecedente()">
      ◀️ Semaine précédente
    </button>

    <div
      class="titre-semaine"
      id="titreSemaine">
    </div>

    <button onclick="semaineSuivante()">
      Semaine suivante ▶️
    </button>

  </div>


  <div style="text-align:center; margin-bottom:20px;">

    <button
      class="bouton-principal"
      onclick="revenirAujourdHui()">

      📅 Aujourd'hui

    </button>

  </div>


  <!-- FORMULAIRE -->

  <section class="formulaire">

    <h2>➕ Ajouter une activité</h2>


    <div class="champs">


      <label>

        Jour

        <select id="jour">

          <option value="0">
            Lundi
          </option>

          <option value="1">
            Mardi
          </option>

          <option value="2">
            Mercredi
          </option>

          <option value="3">
            Jeudi
          </option>

          <option value="4">
            Vendredi
          </option>

          <option value="5">
            Samedi
          </option>

          <option value="6">
            Dimanche
          </option>

        </select>

      </label>


      <label>

        Activité

        <input
          type="text"
          id="activite"
          placeholder="Ex : Réunion">

      </label>


      <label>

        Heure de début

        <input
          type="time"
          id="debut">

      </label>


      <label>

        Heure de fin

        <input
          type="time"
          id="fin">

      </label>


      <label>

        Couleur

        <input
          type="color"
          id="couleur"
          value="#2563eb">

      </label>


      <label>

        Date

        <input
          type="date"
          id="dateActivite">

      </label>


    </div>


    <div class="boutons-formulaire">

      <button
        class="bouton-principal"
        onclick="ajouterActivite()">

        Ajouter au planning

      </button>


      <button
        class="bouton-imprimer"
        onclick="window.print()">

        🖨️ Imprimer

      </button>

    </div>

  </section>


  <!-- CALENDRIER -->

  <section class="calendrier">

    <div
      class="semaine"
      id="calendrier">

    </div>

  </section>


</div>


<footer>

  Mon Créateur de Planning © 2026

</footer>


<script>


/* =========================
   VARIABLES
========================= */


let dateActuelle = new Date();

let planning =
  JSON.parse(
    localStorage.getItem("monPlanning")
  ) || [];


/* =========================
   NOMS DES JOURS
========================= */


const nomsJours = [

  "Lundi",
  "Mardi",
  "Mercredi",
  "Jeudi",
  "Vendredi",
  "Samedi",
  "Dimanche"

];


const nomsMois = [

  "janvier",
  "février",
  "mars",
  "avril",
  "mai",
  "juin",
  "juillet",
  "août",
  "septembre",
  "octobre",
  "novembre",
  "décembre"

];


/* =========================
   OBTENIR LE LUNDI
========================= */


function obtenirLundi(date) {

  const nouvelleDate =
    new Date(date);

  const jour =
    nouvelleDate.getDay();

  const difference =
    jour === 0
      ? -6
      : 1 - jour;

  nouvelleDate.setDate(
    nouvelleDate.getDate() + difference
  );

  nouvelleDate.setHours(0, 0, 0, 0);

  return nouvelleDate;

}


/* =========================
   FORMAT DATE
========================= */


function formatDate(date) {

  const annee =
    date.getFullYear();

  const mois =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const jour =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${annee}-${mois}-${jour}`;

}


/* =========================
   AFFICHER LE CALENDRIER
========================= */


function afficherCalendrier() {


  const lundi =
    obtenirLundi(dateActuelle);


  const calendrier =
    document.getElementById(
      "calendrier"
    );


  calendrier.innerHTML = "";


  const dates = [];


  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const date =
      new Date(lundi);

    date.setDate(
      lundi.getDate() + i
    );

    dates.push(date);

  }


  /* TITRE */

  const premiereDate =
    dates[0];

  const derniereDate =
    dates[6];


  document.getElementById(
    "titreSemaine"
  ).textContent =

    `${premiereDate.getDate()} ${nomsMois[premiereDate.getMonth()]} ${premiereDate.getFullYear()} — ` +

    `${derniereDate.getDate()} ${nomsMois[derniereDate.getMonth()]} ${derniereDate.getFullYear()}`;


  /* CRÉATION DES JOURS */

  dates.forEach(

    function(date, index) {


      const jour =
        document.createElement("div");


      jour.className = "jour";


      const aujourdHui =
        new Date();


      if (
        formatDate(date) ===
        formatDate(aujourdHui)
      ) {

        jour.classList.add(
          "aujourd-hui"
        );

      }


      /* EN-TÊTE */

      const entete =
        document.createElement("div");

      entete.className =
        "entete-jour";


      entete.innerHTML = `

        <div class="nom-jour">

          ${nomsJours[index]}

        </div>

        <div class="date-jour">

          ${date.getDate()}

        </div>

        <div class="mois">

          ${nomsMois[date.getMonth()]}

        </div>

      `;


      jour.appendChild(entete);


      /* ACTIVITÉS */

      const zone =
        document.createElement("div");

      zone.className =
        "activites";


      const dateTexte =
        formatDate(date);


      const activites =
        planning
          .filter(
            function(item) {

              return (
                item.date ===
                dateTexte
              );

            }
          )
          .sort(
            function(a, b) {

              return a.debut.localeCompare(
                b.debut
              );

            }
          );


      if (
        activites.length === 0
      ) {

        zone.innerHTML =
          `<div class="aucune-activite">
             Aucune activité
           </div>`;

      }


      activites.forEach(

        function(item) {


          const bloc =
            document.createElement(
              "div"
            );


          bloc.className =
            "activite";


          bloc.style.borderLeftColor =
            item.couleur;


          bloc.innerHTML = `

            <div class="activite-nom">

              ${echapper(item.nom)}

            </div>

            <div class="activite-heure">

              🕐 ${item.debut}
              -
              ${item.fin}

            </div>


            <div class="actions">

              <button
                class="modifier"
                onclick="modifierActivite(${item.id})">

                Modifier

              </button>


              <button
                class="supprimer"
                onclick="supprimerActivite(${item.id})">

                Supprimer

              </button>

            </div>

          `;


          zone.appendChild(
            bloc
          );

        }
      );


      jour.appendChild(
        zone
      );


      calendrier.appendChild(
        jour
      );

    }
  );

}


/* =========================
   AJOUTER UNE ACTIVITÉ
========================= */


function ajouterActivite() {


  const nom =
    document.getElementById(
      "activite"
    ).value.trim();


  const debut =
    document.getElementById(
      "debut"
    ).value;


  const fin =
    document.getElementById(
      "fin"
    ).value;


  const couleur =
    document.getElementById(
      "couleur"
    ).value;


  const dateChoisie =
    document.getElementById(
      "dateActivite"
    ).value;


  if (!nom) {

    alert(
      "Veuillez entrer une activité."
    );

    return;

  }


  if (!debut || !fin) {

    alert(
      "Veuillez choisir les horaires."
    );

    return;

  }


  if (debut >= fin) {

    alert(
      "L'heure de fin doit être après l'heure de début."
    );

    return;

  }


  if (!dateChoisie) {

    alert(
      "Veuillez choisir une date."
    );

    return;

  }


  const nouvelleActivite = {

    id: Date.now(),

    nom: nom,

    debut: debut,

    fin: fin,

    couleur: couleur,

    date: dateChoisie

  };


  planning.push(
    nouvelleActivite
  );


  sauvegarder();


  afficherCalendrier();


  /* RÉINITIALISATION */

  document.getElementById(
    "activite"
  ).value = "";


  document.getElementById(
    "debut"
  ).value = "";


  document.getElementById(
    "fin"
  ).value = "";


  document.getElementById(
    "dateActivite"
  ).value = "";

}


/* =========================
   SUPPRIMER
========================= */


function supprimerActivite(id) {


  if (
    !confirm(
      "Voulez-vous vraiment supprimer cette activité ?"
    )
  ) {

    return;

  }


  planning =
    planning.filter(
      function(item) {

        return item.id !== id;

      }
    );


  sauvegarder();

  afficherCalendrier();

}


/* =========================
   MODIFIER
========================= */


function modifierActivite(id) {


  const item =
    planning.find(
      function(element) {

        return element.id === id;

      }
    );


  if (!item) {

    return;

  }


  document.getElementById(
    "activite"
  ).value = item.nom;


  document.getElementById(
    "debut"
  ).value = item.debut;


  document.getElementById(
    "fin"
  ).value = item.fin;


  document.getElementById(
    "couleur"
  ).value = item.couleur;


  document.getElementById(
    "dateActivite"
  ).value = item.date;


  planning =
    planning.filter(
      function(element) {

        return element.id !== id;

      }
    );


  sauvegarder();

  afficherCalendrier();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   SEMAINES
========================= */


function semainePrecedente() {


  dateActuelle.setDate(
    dateActuelle.getDate() - 7
  );


  afficherCalendrier();

}


function semaineSuivante() {


  dateActuelle.setDate(
    dateActuelle.getDate() + 7
  );


  afficherCalendrier();

}


function revenirAujourdHui() {


  dateActuelle =
    new Date();


  afficherCalendrier();

}


/* =========================
   SAUVEGARDE
========================= */


function sauvegarder() {

  localStorage.setItem(

    "monPlanning",

    JSON.stringify(
      planning
    )

  );

}


/* =========================
   SÉCURITÉ DU TEXTE
========================= */


function echapper(texte) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    texte;


  return div.innerHTML;

}


/* =========================
   DATE PAR DÉFAUT
========================= */


document.getElementById(
  "dateActivite"
).value =
  formatDate(
    new Date()
  );


/* =========================
   LANCEMENT
========================= */


afficherCalendrier();


</script>

</body>
</html>
